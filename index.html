<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dhruvi Dhamecha is a product designer in Montreal, turning messy problems into calm, simple screens.">
<meta property="og:title" content="Dhruvi Dhamecha · Product Designer">
<meta property="og:description" content="Product designer in Montreal. Field apps, dashboards, admin tools and AI features.">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Dhruvi Dhamecha · Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Caveat:wght@500;600;700&display=swap">
<style>
/* Layout: the home page is a design file. Toolbar, layers, an infinite canvas of real frames, and an inspect panel. Light only. */
:root{
  --canvas:#f4f4f2; --dot:#d6d6d2; --panel:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e6e6e3;
  --sel:#0d99ff; --me:#ff3d8b; --you:#14ae5c; --sticky:#fff0a3; --sticky2:#ffd6e7; --sticky3:#d4f5e2;
  --ui:"Geist", "Helvetica Neue", Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --hand:"Caveat", "Comic Sans MS", cursive;
  --pc:#1d6fe0; --pt:#e6efff;
  --gut:max(16px, env(safe-area-inset-left, 0px)); --gutr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block;-webkit-user-drag:none;user-select:none}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ---------- app shell ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:240px 1fr 260px}
.top{grid-column:1/-1;height:calc(48px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:5}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:500;font-size:15px;flex:none}
.tools{display:flex;gap:2px}
.tools button{width:34px;height:34px;border:0;background:none;border-radius:6px;display:grid;place-items:center}
.tools button[aria-pressed="true"]{background:var(--sel);color:#fff}
.tools button:hover:not([aria-pressed="true"]){background:#f0f0ee}
.file{margin:0 auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file b{color:var(--ink);font-weight:500}
.avs{display:flex;align-items:center}
.avs span{width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;margin-left:-6px}
.hi{border:0;background:var(--sel);color:#fff;border-radius:6px;padding:7px 14px;font-weight:500;font-size:13px;flex:none}
.zoomv{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:right}

.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 8px;z-index:4;padding-left:max(8px,env(safe-area-inset-left,0px))}
.side h6,.insp h6{margin:6px 8px 8px;font-size:11px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.side .pg{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px}
.side .pg.on{background:#f0f0ee;font-weight:500}
.layers{list-style:none;margin:4px 0 0;padding:0}
.layers button{width:100%;text-align:left;border:0;background:none;padding:6px 8px 6px 10px;border-radius:6px;display:flex;align-items:center;gap:8px;font-size:13px}
.layers button:hover{background:#f4f4f2}
.layers button.on{background:#e5f4ff;color:#005ea8}
.layers svg{flex:none;color:var(--muted)}
.layers .sub{padding-left:28px;color:var(--muted);font-size:12px}
.side .foot{margin:18px 8px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

.insp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;z-index:4;padding-right:max(12px,env(safe-area-inset-right,0px))}
.insp .tabs{display:flex;gap:14px;border-bottom:1px solid var(--line);padding:0 4px 10px;margin-bottom:12px;font-size:13px}
.insp .tabs span{color:var(--muted)} .insp .tabs span.on{color:var(--ink);font-weight:600}
.prop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 4px 14px}
.prop div{background:#f5f5f3;border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:12px;display:flex;gap:8px}
.prop div i{color:var(--muted);font-style:normal}
.fill{display:flex;align-items:center;gap:8px;margin:0 4px 14px;font-family:var(--mono);font-size:12px}
.fill b{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.1)}
.insp .desc{margin:0 4px 14px;color:var(--ink);font-size:13px}
.insp .desc.muted{color:var(--muted)}
.open{width:calc(100% - 8px);margin:0 4px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:10px;font-weight:500;display:flex;justify-content:center;gap:8px}
.open[hidden]{display:none}
.copyrow{margin:16px 4px 0;display:flex;flex-direction:column;gap:8px}
.copyrow code{font-family:var(--mono);font-size:12px;background:#f5f5f3;padding:8px;border-radius:6px;user-select:all;word-break:break-all}
.copyrow button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px}

/* ---------- canvas ---------- */
.stage{position:relative;overflow:hidden;touch-action:none;cursor:default;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px}
.stage.grab{cursor:grab} .stage.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.fr{position:absolute}
.fr .lbl{position:absolute;left:0;bottom:100%;margin-bottom:6px;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center;transform-origin:0 100%}
.fr .lbl b{color:var(--ink);font-weight:500}
.fr .body{position:absolute;inset:0;background:var(--t,#fff);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.fr.proj{cursor:pointer}
.fr .selbox{position:absolute;inset:-2px;border:2px solid var(--sel);pointer-events:none;opacity:0}
.fr .selbox i{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--sel)}
.fr .selbox i:nth-child(1){left:-6px;top:-6px}.fr .selbox i:nth-child(2){right:-6px;top:-6px}.fr .selbox i:nth-child(3){left:-6px;bottom:-6px}.fr .selbox i:nth-child(4){right:-6px;bottom:-6px}
.fr .selbox .dim{position:absolute;left:50%;top:100%;margin-top:8px;transform:translateX(-50%);background:var(--sel);color:#fff;font-family:var(--mono);font-size:12px;padding:2px 6px;border-radius:4px;white-space:nowrap;transform-origin:50% 0}
.fr.proj:hover .selbox,.fr.sel .selbox{opacity:1}
.fr.proj:hover .lbl,.fr.sel .lbl{color:var(--sel)}
.fr.proj:hover .lbl b,.fr.sel .lbl b{color:var(--sel)}

/* project frame inner composition */
.cv{position:absolute;inset:0;padding:56px}
.cv .h{font-weight:500;font-size:60px;letter-spacing:-.035em;line-height:1;margin:0}
.cv .k{font-size:22px;color:rgba(29,29,31,.66);margin:12px 0 0;max-width:20em}
.cv .tagrow{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.cv .tagrow span{border:1px solid rgba(29,29,31,.16);border-radius:999px;padding:5px 12px;font-size:15px;background:rgba(255,255,255,.6)}
.shot{position:absolute;box-shadow:0 24px 50px -24px rgba(0,0,0,.35);border-radius:10px;overflow:hidden;background:#fff}
.shot.tab{border-radius:0;background:none;box-shadow:none;overflow:visible;filter:drop-shadow(0 20px 26px rgba(0,0,0,.2))}
.shot.ph{border-radius:26px;border:1px solid var(--line)}
.shot.doc{border-radius:4px}
.cv .cta{position:absolute;left:56px;bottom:48px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:18px;color:var(--c)}
.cv .cta i{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-style:normal}


/* off screen + path frames */
.mebody{background:#fff;padding:44px 52px;display:grid;grid-template-columns:1.15fr .85fr;grid-template-rows:auto auto 1fr;gap:22px 48px;position:relative}
.mehead{font-weight:500;font-size:40px;letter-spacing:-.03em;grid-column:1}
.traits{display:flex;flex-wrap:wrap;gap:18px 16px;align-content:start}
.traits{grid-column:1}.traits .tr{position:relative;font-family:var(--hand);font-size:36px;font-weight:600;letter-spacing:0;padding:16px 24px 18px;transform:rotate(var(--r))}
.traits .tr:nth-child(3n+2){background:var(--sticky2)}.traits .tr:nth-child(3n){background:var(--sticky3)}
.hobbies{grid-column:2;grid-row:1/4;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}.hobbies .hh{grid-column:1/-1;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:14px}
.hob{border:1px solid var(--line);border-radius:14px;padding:18px;font-size:18px;display:grid;gap:10px;min-height:120px;align-content:space-between}
.hob .e{font-size:36px;line-height:1}
.fact{grid-column:1;align-self:start;margin-top:24px;font-size:22px;line-height:1.35;color:#3a3a3d;max-width:24em;position:relative}
.fact b{display:block;font-family:var(--ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500}
.squig{position:absolute;right:0;top:-34px;width:120px}
.path{list-style:none;margin:0;padding:0 0 0 26px;border-left:2px dashed var(--line);display:grid;gap:22px}
.path li{position:relative;display:grid;gap:2px}
.path li:before{content:"";position:absolute;left:-34px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.path li.now:before{background:var(--me);border-color:var(--me);box-shadow:0 0 0 6px #ffe0ec}
.path b{font-size:14px;font-family:var(--mono);color:var(--muted);font-weight:500}
.path span{font-size:20px;letter-spacing:-.01em;line-height:1.35}
.path li.now span{font-weight:500}
/* intro layers */
.txt{position:absolute;white-space:nowrap;font-weight:500;letter-spacing:-.045em;line-height:1}
.txt.editing{outline:2px solid var(--sel);outline-offset:6px}
.txt .caret{display:inline-block;width:6px;height:.85em;background:var(--sel);margin-left:6px;vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sticky{position:absolute;background:var(--sticky);padding:26px 28px;font-family:var(--hand);font-size:38px;font-weight:600;line-height:1.1;box-shadow:0 18px 30px -18px rgba(0,0,0,.3);transform-origin:0 0}
.sticky small{display:block;font-family:var(--ui);font-size:15px;color:rgba(29,29,31,.5);margin-top:16px}
.cmt{position:absolute;display:flex;gap:8px;align-items:flex-start}
.cmt .pin{width:40px;height:40px;border-radius:50% 50% 50% 4px;background:var(--me);color:#fff;display:grid;place-items:center;font-weight:500;font-size:15px;flex:none;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
.cmt .bub{width:max-content;background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px -12px rgba(0,0,0,.3);font-family:var(--hand);font-size:30px;font-weight:600;line-height:1.1;max-width:360px}
.redline{position:absolute;color:var(--me);font-family:var(--mono);font-size:14px}
.redline:before{content:"";position:absolute;background:var(--me)}
.redline.h:before{left:0;right:0;top:50%;height:1.5px}
.redline.h span{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:var(--me);color:#fff;padding:1px 6px;border-radius:3px}
.redline.v:before{top:0;bottom:0;left:50%;width:1.5px}
.redline.v span{position:absolute;top:50%;left:10px;transform:translateY(-50%);background:var(--me);color:#fff;padding:1px 6px;border-radius:3px}

.me-st{position:absolute;width:170px;height:170px;border-radius:50%;background:#fff;padding:8px;box-shadow:0 18px 30px -14px rgba(0,0,0,.35);transform:rotate(-8deg) scale(0);transform-origin:50% 50%}
.me-st img{width:100%;height:100%;border-radius:50%;display:block}
.me-st span{position:absolute;left:46px;bottom:-60px;font-family:var(--hand);font-size:30px;font-weight:700;color:var(--me);transform:rotate(8deg);white-space:nowrap}
.me-st span:before{content:"";position:absolute;left:-30px;top:-14px;width:26px;height:26px;border-left:2.5px solid var(--me);border-bottom:2.5px solid var(--me);border-radius:0 0 0 22px}
/* cursors */
.cur{position:absolute;left:0;top:0;pointer-events:none;z-index:6;will-change:transform}
.cur .tag{position:absolute;left:16px;top:18px;color:#fff;font-size:12px;font-weight:500;padding:3px 8px;border-radius:4px 10px 10px 10px;white-space:nowrap}
#you{display:none}
.stage.has-you{cursor:none}
.stage.has-you.grabbing{cursor:grabbing}

/* zoom dock */
.dock{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;z-index:5;box-shadow:0 6px 20px -10px rgba(0,0,0,.25)}
.dock button{border:0;background:none;border-radius:6px;padding:6px 10px;font-size:13px}
.dock button:hover{background:#f2f2f0}
.hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:7px 12px;border-radius:999px;z-index:5;white-space:nowrap;transition:opacity .5s}

/* mobile frames sheet */
.sheet{display:none}

/* ---------- loader ---------- */
.ld{position:fixed;inset:0;z-index:50;background:#fff;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s}
.ld.on{opacity:1;pointer-events:auto}
.ld .in{display:grid;justify-items:center;gap:22px;text-align:center;padding-left:var(--gut);padding-right:var(--gutr)}
.ld .dots{position:relative;width:64px;height:64px;animation:spin 1.4s cubic-bezier(.6,0,.4,1) infinite}
.ld .dots i{position:absolute;width:24px;height:24px;border-radius:50%}
.ld .dots i:nth-child(1){left:0;top:0;background:var(--me)}.ld .dots i:nth-child(2){right:0;top:0;background:#ffc83d}.ld .dots i:nth-child(3){left:0;bottom:0;background:var(--you)}.ld .dots i:nth-child(4){right:0;bottom:0;background:var(--sel)}
@keyframes spin{to{transform:rotate(360deg)}}
.ld .t{font-weight:500;font-size:20px;letter-spacing:-.02em}
.ld .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ld .bar{width:220px;height:4px;background:#eee;border-radius:2px;overflow:hidden}
.ld .bar b{display:block;height:100%;width:0;background:var(--ink);transition:width 1.1s cubic-bezier(.4,0,.2,1)}

/* ---------- detail: prototype file ---------- */
.doc{position:fixed;inset:0;z-index:30;overflow-x:hidden;background:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px;overflow:auto;-webkit-overflow-scrolling:touch}
.doc-top{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.doc-top .row{height:52px;display:flex;align-items:center;gap:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.back{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:center;flex:none}
.dname{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-size:14px;white-space:nowrap;overflow:hidden}
.dname .muted{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.mark.sm{width:24px;height:24px;border-radius:6px;font-size:12px}
.prog{height:2px;background:transparent}.prog b{display:block;height:100%;width:0;background:var(--pc)}
.bstory{--st-ink:var(--ink);--st-muted:var(--muted);--st-line:var(--line);--st-surface:#fff;--st-display:var(--ui);--st-body:var(--ui);--st-radius:14px}
.bstory .st-big,.bstory .st-mid{font-weight:500;letter-spacing:-.035em}
.bstory .st-person h4{font-weight:500}
.bstory .st-k{background:var(--st-accent);color:#fff;padding:4px 10px;border-radius:6px;letter-spacing:.01em;text-transform:none;font-size:13px;font-weight:500}
.bstory .st-k:before{display:none}
.bstory .st-beat+.st-beat{border-top:1px dashed #d6d6d2}
.bstory .st-stamp b,.bstory .st-step h4,.bstory .st-opt h4{font-weight:500;letter-spacing:-.025em}
.bstory .st-learn li{background:var(--sticky);border:0;border-radius:2px;font-family:var(--hand);font-size:32px;font-weight:600;line-height:1.1;box-shadow:0 18px 30px -18px rgba(0,0,0,.3);transform:rotate(-1.2deg)}
.bstory .st-learn li:nth-child(2){background:var(--sticky2);transform:rotate(1deg)}.bstory .st-learn li:nth-child(3){background:var(--sticky3);transform:rotate(-.5deg)}
.bstory .st-learn li span{font-family:var(--ui);color:rgba(29,29,31,.5)}
.bstory .st-say{font-size:18px;line-height:1.5;border-left-color:var(--st-accent)}
.flows-unused{display:none}
.flows::-webkit-scrollbar{display:none}
.flows a{flex:none;font-size:13px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
.flows a.on{background:#e5f4ff;color:#005ea8}
.doc-in{max-width:1240px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr);padding-block:56px 120px;display:grid;gap:96px}
.cover{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:center}
.cover .f.desktop{margin-right:calc(-1 * min(9vw,150px))}
.cover .f.phone{max-width:320px}
.cover h1{font-size:clamp(46px,6.4vw,96px);letter-spacing:-.045em;line-height:.95;margin:10px 0 18px;font-weight:500}
.cover p.l{font-size:clamp(19px,2vw,24px);margin:0 0 26px;max-width:24em}
.badge{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--pc);background:var(--pt);padding:4px 8px;border-radius:4px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
.meta span i{font-style:normal;color:var(--muted);margin-right:6px}
.sec{position:relative;background:rgba(255,255,255,.55);border:1.5px solid var(--sc,#d9d9d6);border-radius:18px;padding:44px 40px 40px}
.sec>.slab{position:absolute;left:18px;top:-14px;background:var(--sc,#d9d9d6);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px}
.sec h2{font-size:clamp(28px,3.4vw,46px);letter-spacing:-.035em;line-height:1.04;margin:0 0 16px;font-weight:700;max-width:18em;text-wrap:balance}
.sec .cols{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:44px;align-items:start}
.sec.solo .cols{grid-template-columns:minmax(0,1fr)}
.sec p{color:#3a3a3d;margin:0 0 12px;max-width:36em;font-size:16px;line-height:1.6}
.sec .note{font-family:var(--hand);font-size:28px;color:var(--me);line-height:1.1;margin-top:18px;display:flex;gap:10px;align-items:flex-start}
.sec .note svg{flex:none;margin-top:4px}
.frames{display:grid;gap:40px}
.frames.multi{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));align-items:end}
.f{position:relative}
.f .fl{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.f .fl b{font-weight:500;color:var(--ink)}
.f .fi{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.f .fi img{width:100%;height:auto}
.f .fi .selbox{position:absolute;inset:-2px;border:2px solid var(--sel);opacity:0;transition:opacity .15s;pointer-events:none}
.f .fi .selbox i{position:absolute;width:8px;height:8px;background:#fff;border:2px solid var(--sel)}
.f .fi .selbox i:nth-child(1){left:-5px;top:-5px}.f .fi .selbox i:nth-child(2){right:-5px;top:-5px}.f .fi .selbox i:nth-child(3){left:-5px;bottom:-5px}.f .fi .selbox i:nth-child(4){right:-5px;bottom:-5px}
.f .fi .selbox span{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);background:var(--sel);color:#fff;font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.f:hover .selbox{opacity:1}
.f.phone{max-width:300px;margin:0 auto;width:100%}
.f.phone .fi{border-radius:30px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 60px -32px rgba(0,0,0,.3)}
.f.land .fi{background:none;box-shadow:none;filter:drop-shadow(0 24px 30px rgba(0,0,0,.18))}
.f.desktop .fi{border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 60px -36px rgba(0,0,0,.35)}
.f.doc .fi{max-width:440px;margin:0 auto;box-shadow:0 20px 40px -24px rgba(0,0,0,.35)}
.f.doc .fl{max-width:440px;margin:0 auto 6px}
.f figcaption{font-size:13px;color:var(--muted);margin-top:12px}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:8px}
.people .sticky{position:relative;font-size:30px;padding:22px 22px 26px}
.people .sticky:nth-child(1){transform:rotate(-2deg)} .people .sticky:nth-child(2){transform:rotate(1.5deg);background:var(--sticky2)} .people .sticky:nth-child(3){transform:rotate(-1deg);background:var(--sticky3)}
.people .sticky p{font-family:var(--ui);font-size:15px;color:#3a3a3d;margin:10px 0 0;line-height:1.45}
.lessons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.lessons .sticky{position:relative;font-size:28px}
.lessons .sticky:nth-child(3n+1){transform:rotate(-1.6deg)}.lessons .sticky:nth-child(3n+2){transform:rotate(1.2deg);background:var(--sticky2)}.lessons .sticky:nth-child(3n){transform:rotate(-.6deg);background:var(--sticky3)}
.nextp{display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--ink);color:#fff;border-radius:18px;padding:36px 40px;text-decoration:none;flex-wrap:wrap}
.nextp b{font-size:clamp(32px,5vw,64px);letter-spacing:-.035em;line-height:1;font-weight:500}
.nextp span{font-family:var(--mono);font-size:12px;color:#b5b5ba;display:block;margin-bottom:8px}
.nextp i{font-style:normal;width:56px;height:56px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:22px;flex:none}
.rv{opacity:1;transform:none;transition:opacity .6s, transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.pre{opacity:0;transform:translateY(30px)}

@media (max-width:1100px){ .app{grid-template-columns:200px 1fr 0} .insp{display:none} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side,.insp,.tools,.avs,.zoomv{display:none}
  .file{margin:0;flex:1}
  .sheet{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:6;gap:8px;overflow-x:auto;padding:10px var(--gutr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut);background:linear-gradient(transparent,rgba(244,244,242,.95) 30%);scrollbar-width:none}
  .sheet::-webkit-scrollbar{display:none}
  .sheet button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;display:flex;gap:6px;align-items:center}
  .sheet button i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
  .dock{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .hint{bottom:auto;top:12px;left:var(--gut);transform:none}
  .cover,.sec .cols,.people,.lessons{grid-template-columns:minmax(0,1fr)}
  .cover .f.desktop{margin-right:0}
  .sec{padding:36px 18px 24px}
  .nextp{padding:26px 22px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="mark" aria-hidden="true">D</div>
    <div class="tools" role="toolbar" aria-label="Canvas tools">
      <button type="button" id="tMove" aria-pressed="true" title="Select (V)"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.5l10 6.2-4.4 1 2.6 4.6-1.8 1-2.6-4.6L3.5 13z"/></svg></button>
      <button type="button" id="tHand" aria-pressed="false" title="Hand (H)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 8V3.5a1 1 0 012 0V7m0-4.5a1 1 0 012 0V7m0-3a1 1 0 012 0v4.5c0 3-1.8 5.5-4.5 5.5S3 12 2.4 10.2L1.8 8.6a1 1 0 011.8-.8L5 9.5"/></svg></button>
    </div>
    <div class="file"><span>Drafts /</span><b>Dhruvi Dhamecha, Portfolio</b></div>
    <div class="avs" aria-hidden="true"><span style="background:var(--me)">D</span><span style="background:var(--you)">You</span></div>
    <span class="zoomv" id="zoomv">100%</span>
    <button class="hi" type="button" id="hiBtn">Say hi</button>
  </header>

  <aside class="side" aria-label="Layers">
    <h6>Pages</h6>
    <div class="pg on"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6l3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Home</div>
    <h6 style="margin-top:16px">Layers</h6>
    <ul class="layers" id="layers"></ul>
    <div class="foot">Drag to pan. Pinch or ⌘/Ctrl + scroll to zoom. Click a frame to open it.</div>
  </aside>

  <main class="stage" id="stage" aria-label="Portfolio canvas">
    <div class="world" id="world"></div>
    <div class="cur" id="me"><svg width="22" height="24" viewBox="0 0 22 24"><path d="M2 2l17 9.5-7.6 1.6L8 21z" fill="#ff3d8b" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="tag" style="background:var(--me)">Dhruvi</span></div>
    <div class="cur" id="you"><svg width="22" height="24" viewBox="0 0 22 24"><path d="M2 2l17 9.5-7.6 1.6L8 21z" fill="#14ae5c" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="tag" style="background:var(--you)">You</span></div>
    <div class="dock"><button type="button" id="zOut" aria-label="Zoom out">−</button><button type="button" id="zFit">Fit</button><button type="button" id="zIn" aria-label="Zoom in">+</button></div>
    <div class="hint" id="hint">Drag the canvas around. Click any frame to open it.</div>
    <nav class="sheet" id="sheet" aria-label="Jump to frame"></nav>
  </main>

  <aside class="insp" aria-label="Inspect">
    <div class="tabs"><span class="on">Design</span><span>Prototype</span><span>Inspect</span></div>
    <div id="inspBody"></div>
  </aside>
</div>

<div class="ld" id="ld" aria-hidden="true"><div class="in"><div class="dots"><i></i><i></i><i></i><i></i></div><div class="t" id="ldT">Opening Patrol</div><div class="bar"><b id="ldB"></b></div><div class="s" id="ldS">Loading frames…</div></div></div>

<div class="doc" id="doc" hidden></div>

<script src="content.js"></script>
<script src="story.js"></script>
<script>
(() => {
const D = window.DD, $ = s => document.querySelector(s), img = D.img;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('#stage'), world = $('#world');
const cam = { x: 0, y: 0, z: 1 };
const store = { get(k){ try { return sessionStorage.getItem(k) } catch(e){ return null } }, set(k,v){ try { sessionStorage.setItem(k,v) } catch(e){} } };

/* ---------- world content ---------- */
const P = D.byId;
const layout = {
  patrol: { x:0, y:620, w:1240, h:780, shots:[
      { s:'patrol-tablet-recording', cls:'tab', x:470, y:56, w:720 },
      { s:'patrol-web-flagged', cls:'', x:470, y:416, w:540 },
      { s:'patrol-mobile-synced', cls:'ph', x:1030, y:404, w:160 } ] },
  dashboards: { x:1340, y:620, w:900, h:780, shots:[
      { s:'dash-v2', cls:'', x:300, y:250, w:560, crop:.62 },
      { s:'gauges', cls:'', x:80, y:420, w:260, crop:.34 } ] },
  access: { x:0, y:1520, w:1240, h:600, shots:[ { s:'rbac-ai-role', cls:'tab', x:600, y:60, w:600 }, { s:'rbac-departments-c', cls:'', x:330, y:350, w:440 } ] },
  forkcast: { x:1340, y:1520, w:900, h:600, shots:[
      { s:'fk3-home', cls:'ph', x:400, y:150, w:150 }, { s:'fk3-picks', cls:'ph', x:560, y:100, w:150 }, { s:'fk3-stamp', cls:'ph', x:720, y:170, w:150 } ], kw:330 },
  extra: { x:0, y:2220, w:1240, h:600 }
};
const frames = [
  { id:'intro', name:'Intro', x:0, y:0, w:1240, h:480, plain:true },
  { id:'about', name:'About', x:1340, y:0, w:900, h:480, plain:true },
  ...D.projects.map((p, i) => ({ id: p.id, ...(layout[p.id] || { ...layout.extra, shots: p.cv || [] }) })),
  { id:'me', name:'Off screen', x:0, y:2220, w:1240, h:520, plain:true },
  { id:'path', name:'My path', x:1340, y:2220, w:900, h:640, plain:true }
];
const worldBounds = (() => { const xs = frames.map(f => f.x), ys = frames.map(f => f.y), xe = frames.map(f => f.x + f.w), ye = frames.map(f => f.y + f.h);
  return { x: Math.min(...xs) - 60, y: Math.min(...ys) - 80, w: Math.max(...xe) - Math.min(...xs) + 120, h: Math.max(...ye) - Math.min(...ys) + 140 }; })();

function frameHTML(f){
  if (f.id === 'intro') return `<div class="fr" data-id="intro" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px">
      <div class="lbl"><b>Intro</b></div>
      <div class="body" style="background:#fff"></div>
      <div class="txt" id="t1" style="left:64px;top:56px;font-size:200px"></div>
      <div class="txt" id="t2" style="left:70px;top:290px;font-size:96px;color:var(--me)"></div>
      <div class="sticky" id="st" style="left:806px;top:70px;width:380px;transform:rotate(3deg) scale(0)">${D.intro[2]}<small>Sticky note, from Dhruvi</small></div>
      <div class="me-st" id="mest" style="left:592px;top:58px"><img src="${img('me-sticker')}" alt="Photo of Dhruvi" draggable="false"><span>that's me!</span></div>
    </div>`;
  if (f.id === 'about') return `<div class="fr" data-id="about" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px">
      <div class="lbl"><b>About</b><span>${D.city}</span></div>
      <div class="body" style="background:#fff;padding:52px 56px">
        <div style="font-weight:500;font-size:44px;letter-spacing:-.03em;line-height:1.05;max-width:16em">I listen first. Then I design.</div>
        <p style="font-size:18px;color:#4a4a4f;max-width:40em;margin:16px 0 0;line-height:1.5">${D.about}</p>
        <div style="display:flex;gap:8px;margin-top:22px;flex-wrap:wrap">${D.facts.slice(0, 2).map(([k,v]) => `<span style="border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px"><span style="color:var(--muted)">${k}:</span> ${v}</span>`).join('')}</div>
      </div>
    </div>`;
  if (f.id === 'me') return `<div class="fr" data-id="me" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px">
      <div class="lbl"><b>Off screen</b><span>the non-pixel parts</span></div>
      <div class="body mebody">
        <div class="mehead">Friends would say I'm…</div>
        <div class="traits">${D.traits.map((t, i) => `<span class="sticky tr" style="--r:${[-4,3,-2,5,-3,2][i % 6]}deg">${t}</span>`).join('')}</div>
        <div class="hobbies"><b class="hh">When I'm not designing</b>${D.offscreen.map(([e, t]) => `<div class="hob"><span class="e">${e}</span>${t}</div>`).join('')}</div>
        <div class="fact"><b>Fun fact</b>${D.funfact}</div>
      </div>
    </div>`;
  if (f.id === 'path') return `<div class="fr" data-id="path" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px">
      <div class="lbl"><b>My path</b><span>so far</span></div>
      <div class="body" style="background:#fff;padding:44px 52px">
        <ol class="path">${D.timeline.map(([y, t], i) => `<li class="${i === D.timeline.length - 1 ? 'now' : ''}"><b>${y}</b><span>${t}</span></li>`).join('')}</ol>
      </div>
    </div>`;
  const p = P[f.id];
  return `<div class="fr proj" data-id="${f.id}" data-open="${f.id}" role="link" tabindex="0" aria-label="Open ${p.title}" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;--t:${p.tint};--c:${p.color}">
    <div class="lbl"><b>${p.title}</b></div>
    <div class="body">
      <div class="cv">
        <h3 class="h">${p.title}</h3>
        <p class="k"${f.kw ? ` style="max-width:${f.kw}px"` : ''}>${p.line}</p>
        <div class="tagrow"><span>${p.platform}</span><span>${p.year}</span></div>
        ${f.shots.map(s => {
          const [w0,h0] = D.dims[s.s]; const hh = s.crop ? Math.round(s.w * h0 / w0 * s.crop) : null;
          return `<div class="shot ${s.cls}" style="left:${s.x}px;top:${s.y}px;width:${s.w}px;${hh ? `height:${hh}px` : ''}"><img alt="" src="${img(s.s)}" loading="lazy" draggable="false"></div>`; }).join('')}
        <div class="cta"><i>→</i>Open case study</div>
      </div>
    </div>
    <div class="selbox"><i></i><i></i><i></i><i></i><span class="dim">${f.w} × ${f.h}</span></div>
  </div>`;
}
world.innerHTML = frames.map(frameHTML).join('') + `
  <div class="cmt" style="left:1150px;top:560px"><div class="pin">D</div><div class="bub">start here, it's my favourite</div></div>
  <div class="cmt" style="left:40px;top:1460px"><div class="pin">D</div><div class="bub">AI that asks before it acts</div></div>
  <div class="cmt" style="left:2020px;top:1460px"><div class="pin">D</div><div class="bub">the fun one 🍜</div></div>
  <div class="cmt" style="left:760px;top:2150px"><div class="pin">D</div><div class="bub">the human behind the pixels</div></div>
  <div class="redline h" style="left:1240px;top:1010px;width:100px"><span>100</span></div>
  <div class="redline v" style="left:620px;top:1400px;height:120px"><span>120</span></div>`;

/* layers + sheet */
const icon = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 0v12M9 0v12M0 3h12M0 9h12"/></svg>';
$('#layers').innerHTML = frames.map(f => `<li><button type="button" data-go="${f.id}">${icon}${f.name || P[f.id].title}</button></li>`).join('');
$('#sheet').innerHTML = frames.map(f => `<button type="button" data-go="${f.id}" style="--c:${f.id in P ? P[f.id].color : '#1d1d1f'}"><i></i>${f.name || P[f.id].title}</button>`).join('');

/* ---------- camera ---------- */
function apply(){ world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`; stage.style.backgroundPosition = `${cam.x}px ${cam.y}px`; stage.style.backgroundSize = `${24*cam.z}px ${24*cam.z}px`; $('#zoomv').textContent = Math.round(cam.z*100) + '%';
  const inv = 1 / cam.z; world.querySelectorAll('.lbl,.dim').forEach(l => l.style.transform = (l.classList.contains('dim') ? 'translateX(-50%) ' : '') + `scale(${Math.min(inv, 6)})`); }
function fitRect(r, pad = 40){
  const W = stage.clientWidth, H = stage.clientHeight - (innerWidth < 760 ? 60 : 0);
  const z = Math.min((W - pad*2) / r.w, (H - pad*2) / r.h, 2);
  return { z, x: (W - r.w*z)/2 - r.x*z, y: (H - r.h*z)/2 - r.y*z + (innerWidth < 760 ? 0 : 0) };
}
let anim = null;
function flyTo(t, dur = 900, done){
  cancelAnimationFrame(anim);
  if (reduce) { Object.assign(cam, t); apply(); done && done(); return; }
  const s = { ...cam }, t0 = performance.now();
  const step = now => { let k = Math.min(1, (now - t0) / dur); k = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
    cam.x = s.x + (t.x - s.x)*k; cam.y = s.y + (t.y - s.y)*k; cam.z = s.z + (t.z - s.z)*k; apply();
    if (k < 1) anim = requestAnimationFrame(step); else done && done(); };
  anim = requestAnimationFrame(step);
}
const homeView = () => innerWidth < 760 ? fitRect({ x:0, y:0, w:1240, h:480 }, 20) : fitRect({ x:-40, y:-60, w:2320, h:1500 }, 30);
function zoomAt(f, px, py){ const nz = Math.max(.08, Math.min(4, cam.z * f)); const k = nz / cam.z; cam.x = px - (px - cam.x)*k; cam.y = py - (py - cam.y)*k; cam.z = nz; apply(); }

/* ---------- input ---------- */
let hand = false; const pts = new Map(); let drag = null, moved = 0, pinch0 = null;
function setTool(h){ hand = h; $('#tHand').setAttribute('aria-pressed', h); $('#tMove').setAttribute('aria-pressed', !h); stage.classList.toggle('grab', h); }
$('#tHand').onclick = () => setTool(true); $('#tMove').onclick = () => setTool(false);
addEventListener('keydown', e => { if ($('#doc').hidden === false) return; if (e.key === 'h') setTool(true); if (e.key === 'v') setTool(false);
  if (e.key === '+' || e.key === '=') zoomAt(1.2, stage.clientWidth/2, stage.clientHeight/2); if (e.key === '-') zoomAt(1/1.2, stage.clientWidth/2, stage.clientHeight/2);
  if (e.key === 'Enter' && document.activeElement?.dataset?.open) openProject(document.activeElement.dataset.open); });
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.dock,.sheet,.hint')) return;
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; moved = 0; }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x-b.x, a.y-b.y), z: cam.z }; }
  cancelAnimationFrame(anim); stopTour();
});
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  if (e.pointerType === 'mouse') { stage.classList.add('has-you'); const y = $('#you'); y.style.display = 'block'; y.style.transform = `translate(${e.clientX - r.left - 2}px,${e.clientY - r.top - 2}px)`; }
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y); const mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top; zoomAt((pinch0.z * d / pinch0.d) / cam.z, mx, my); moved = 99; return; }
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.hypot(dx, dy)); if (moved > 4) { stage.classList.add('grabbing'); cam.x = drag.cx + dx; cam.y = drag.cy + dy; apply(); } }
});
const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null; if (!pts.size) { stage.classList.remove('grabbing');
    if (drag && moved <= 4 && !hand) { const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-open]'); if (el) openProject(el.dataset.open); else select(null); }
    drag = null; } };
stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
stage.addEventListener('pointerleave', () => { $('#you').style.display = 'none'; stage.classList.remove('has-you'); });
stage.addEventListener('wheel', e => { e.preventDefault(); stopTour(); const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * .0035), e.clientX - r.left, e.clientY - r.top);
  else { cam.x -= e.deltaX; cam.y -= e.deltaY; apply(); } hideHint(); }, { passive: false });
$('#zIn').onclick = () => zoomAt(1.25, stage.clientWidth/2, stage.clientHeight/2);
$('#zOut').onclick = () => zoomAt(.8, stage.clientWidth/2, stage.clientHeight/2);
$('#zFit').onclick = () => flyTo(fitRect(worldBounds, 30));
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) goFrame(g.dataset.go); });
function goFrame(id){ const f = frames.find(q => q.id === id); flyTo(fitRect({ x: f.x - 20, y: f.y - 50, w: f.w + 40, h: f.h + 90 }, 24)); select(id in P ? id : null, id); }
let hintT = setTimeout(hideHint, 9000); function hideHint(){ $('#hint').style.opacity = 0 }
stage.addEventListener('pointerover', e => { const f = e.target.closest('.fr.proj'); if (f && !drag) select(f.dataset.id, null, true); });

/* ---------- inspect ---------- */
function select(id, layerId, hoverOnly){
  if (!hoverOnly) world.querySelectorAll('.fr.sel').forEach(n => n.classList.remove('sel'));
  document.querySelectorAll('#layers button').forEach(b => b.classList.toggle('on', b.dataset.go === (id || layerId)));
  const ib = $('#inspBody');
  if (!id) { ib.innerHTML = `<h6>Page</h6><p class="desc">Home</p><h6>Who made this</h6><p class="desc">${D.name}, ${D.role.toLowerCase()} in ${D.city}.</p>
      <div class="copyrow"><h6 style="margin:0">Email</h6><code id="mail">${D.email}</code><button type="button" id="cp">Copy email</button></div>`; wireCopy(); return; }
  const f = frames.find(q => q.id === id), p = P[id];
  if (!hoverOnly) world.querySelector(`.fr[data-id="${id}"]`).classList.add('sel');
  ib.innerHTML = `<h6>Frame</h6><div class="prop"><div><i>X</i>${f.x}</div><div><i>Y</i>${f.y}</div><div><i>W</i>${f.w}</div><div><i>H</i>${f.h}</div></div>
    <h6>Fill</h6><div class="fill"><b style="background:${p.tint}"></b>${p.tint.toUpperCase()}</div>
    <h6>Accent</h6><div class="fill"><b style="background:${p.color}"></b>${p.color.toUpperCase()}</div>
    <h6>Status</h6><p class="desc">${p.status}</p>
    <h6>${p.title}</h6><p class="desc">${p.line}</p><p class="desc muted">${p.kicker}. ${p.role}.</p>
    <button class="open" type="button" data-openbtn="${id}">Open prototype <span>→</span></button>`;
  ib.querySelector('[data-openbtn]').onclick = () => openProject(id);
}
function wireCopy(){ const b = $('#cp'); if (!b) return; b.onclick = () => { const ok = () => b.textContent = 'Copied'; const sel = () => { const r = document.createRange(); r.selectNodeContents($('#mail')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected, press copy'; };
  try { navigator.clipboard.writeText(D.email).then(ok, sel) } catch(e){ sel() } } }
$('#hiBtn').onclick = () => { goFrame('about'); select(null); };

/* ---------- Dhruvi's cursor ---------- */
const me = $('#me'); let mePos = { x: 2000, y: -200 };
function placeMe(){ const sx = mePos.x * cam.z + cam.x, sy = mePos.y * cam.z + cam.y; me.style.transform = `translate(${sx}px,${sy}px)`; }
const _apply = apply; apply = function(){ _apply(); placeMe(); };
function moveMe(x, y, dur = 900){ return new Promise(res => { const s = { ...mePos }, t0 = performance.now();
  const step = now => { let k = Math.min(1, (now - t0)/dur); k = 1 - Math.pow(1 - k, 3); mePos.x = s.x + (x - s.x)*k + Math.sin(k*Math.PI)*30; mePos.y = s.y + (y - s.y)*k; placeMe(); k < 1 ? requestAnimationFrame(step) : res(); };
  requestAnimationFrame(step); }); }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function typeInto(el, text, speed = 90){ el.classList.add('editing'); for (let i = 1; i <= text.length; i++) { el.innerHTML = text.slice(0, i) + '<span class="caret"></span>'; await wait(speed); } await wait(300); el.innerHTML = text; el.classList.remove('editing'); }
async function intro(){
  const t1 = $('#t1'), t2 = $('#t2'), st = $('#st');
  const ms = $('#mest'); if (reduce || store.get('ddB-intro')) { t1.textContent = D.intro[0]; t2.textContent = D.intro[1]; st.style.transform = 'rotate(3deg)'; ms.style.transform = 'rotate(-8deg)'; mePos = { x: 1150, y: 520 }; placeMe(); wander(); return; }
  store.set('ddB-intro', '1');
  await wait(400);
  await moveMe(80, 150, 1100); await typeInto(t1, D.intro[0], 160);
  await moveMe(90, 330, 700); await typeInto(t2, D.intro[1], 80);
  await moveMe(800, 100, 800);
  st.style.transition = 'transform .5s cubic-bezier(.3,1.6,.5,1)'; st.style.transform = 'rotate(3deg) scale(1)';
  await wait(700);
  await moveMe(640, 150, 700);
  ms.style.transition = 'transform .55s cubic-bezier(.3,1.7,.5,1)'; ms.style.transform = 'rotate(-8deg) scale(1)';
  await wait(800);
  await moveMe(1150, 520, 1000);
  wander();
}
async function wander(){ if (reduce) return; const spots = [[1150,520],[620,1000],[1800,1000],[600,1820],[1790,1800],[620,2500],[1800,2480],[1150,520]]; let i = 0;
  while (true) { await wait(4200 + Math.random()*2500); if (!$('#doc').hidden) continue; i = (i + 1) % spots.length; await moveMe(spots[i][0] + Math.random()*60, spots[i][1] + Math.random()*40, 1400); } }
function stopTour(){}

/* ---------- loader + detail ---------- */
function openProject(id){
  const p = P[id]; if (!p) return;
  history.pushState(null, '', '#' + id);
  const f = frames.find(q => q.id === id);
  select(id);
  flyTo(fitRect({ x: f.x, y: f.y, w: f.w, h: f.h }, 0), 650, () => {
    const ld = $('#ld'); $('#ldT').textContent = 'Opening ' + p.title; $('#ldS').textContent = `${p.beats.length} scenes · prototype included`;
    ld.classList.add('on'); const b = $('#ldB'); b.style.transition = 'none'; b.style.width = '0'; b.offsetWidth; b.style.transition = ''; b.style.width = '100%';
    setTimeout(() => { renderDoc(p); setTimeout(() => ld.classList.remove('on'), 120); }, reduce ? 50 : 1150);
  });
}
const frameOf = id => id.includes('tablet') ? 'land' : D.dims[id][1] > D.dims[id][0] * 1.4 ? 'phone' : 'desktop';
const selbox = (w, h) => `<div class="selbox"><i></i><i></i><i></i><i></i><span>${w} × ${h}</span></div>`;
let story = null;
function renderDoc(p){
  const i = D.projects.indexOf(p), nx = D.projects[(i + 1) % D.projects.length];
  const doc = $('#doc'); doc.style.setProperty('--pc', p.color); doc.style.setProperty('--pt', p.tint);
  doc.innerHTML = `<div class="doc-top"><div class="row"><button class="back" type="button" id="back">← Canvas</button>
      <div class="dname"><span class="mark sm">D</span><b>${p.title}</b><span class="muted">${p.kicker}</span></div></div><div class="prog"><b id="prog"></b></div></div>
    <div class="doc-in">
      <header class="cover"><div><span class="badge">● Case study</span><h1>${p.title}</h1><p class="l">${p.line}</p></div>
        <div class="f ${frameOf(p.cover)}"><div class="fl"><b>${p.title} / cover</b><span class="mono">${D.dims[p.cover].join('×')}</span></div><div class="fi"><img alt="${p.title} cover" src="${img(p.cover)}">${selbox(...D.dims[p.cover])}</div></div></header>
    </div>
    <div id="story" class="bstory"></div>
    <div class="doc-in" style="padding-top:0">
      <a class="nextp" href="#${nx.id}" data-next="${nx.id}"><div><span>Next case study</span><b>${nx.title}</b></div><i>→</i></a>
    </div>`;
  doc.hidden = false; doc.scrollTop = 0;
  story && story.destroy(); story = Story.render($('#story'), p, { img, dims: D.dims, scrollRoot: doc });
  const st = $('#story'); st.style.setProperty('--st-accent', p.color); st.style.setProperty('--st-tint', p.tint);
  $('#back').onclick = () => { history.pushState(null, '', location.pathname + location.search); closeDoc(); };
  doc.querySelector('[data-next]').onclick = e => { e.preventDefault(); const id = nx.id; history.pushState(null, '', '#' + id); const ld = $('#ld'); $('#ldT').textContent = 'Opening ' + nx.title; $('#ldS').textContent = `${nx.beats.length} scenes · prototype included`; ld.classList.add('on'); const b = $('#ldB'); b.style.transition = 'none'; b.style.width = '0'; b.offsetWidth; b.style.transition = ''; b.style.width = '100%'; setTimeout(() => { renderDoc(nx); setTimeout(() => ld.classList.remove('on'), 120); }, reduce ? 50 : 1100); };
  doc.onscroll = () => { const m = doc.scrollHeight - doc.clientHeight; $('#prog').style.width = (m > 0 ? doc.scrollTop / m * 100 : 0) + '%'; };
}
function closeDoc(){ $('#doc').hidden = true; $('#doc').innerHTML = ''; flyTo(homeView(), 900); select(null); }
addEventListener('popstate', () => { const id = location.hash.slice(1); if (P[id]) renderDoc(P[id]); else if (!$('#doc').hidden) closeDoc(); });

/* ---------- boot ---------- */
Object.assign(cam, homeView()); apply(); select(null);
addEventListener('resize', () => { if ($('#doc').hidden) { Object.assign(cam, homeView()); apply(); } });
const start = location.hash.slice(1);
if (P[start]) { renderDoc(P[start]); }
intro();
})();
</script>

</body>
</html>
